[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-report"
version = "1.0.2"
description = "The daily trading report renderer shared by equity-service and crypto-service"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools]
packages = ["trading_report"]

[tool.setuptools.package-data]
trading_report = ["theme.css", "py.typed"]
# `py.typed` is not decoration: without it mypy refuses to read this package's
# annotations in either service and reports `import-untyped` at every call
# site, which is the whole benefit of a strict-typed library thrown away at
# the boundary.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ARG", "C4", "PTH"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
python_files = ["test_*.py"]
testpaths = ["tests"]
